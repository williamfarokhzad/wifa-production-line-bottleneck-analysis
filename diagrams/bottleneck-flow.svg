<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" font-family="DejaVu Sans,sans-serif"><rect width="1000" height="355" rx="18" fill="#edf4f3"/><text x="45" y="55" font-size="40" fill="#163036" font-weight="700">One line, three stations</text><text x="45" y="100" font-size="25" fill="#163036" font-weight="400">Baseline: one waiting slot between adjacent stations</text><rect x="45" y="145" width="220" height="112" rx="12" fill="#125965"/><text x="63" y="192" font-size="30" fill="#ffffff" font-weight="700">Feed</text><text x="63" y="232" font-size="25" fill="#ffffff" font-weight="400">5 s / part</text><rect x="390" y="145" width="220" height="112" rx="12" fill="#883c15"/><text x="408" y="192" font-size="30" fill="#ffffff" font-weight="700">Assemble</text><text x="408" y="232" font-size="25" fill="#ffffff" font-weight="400">8 s / part</text><rect x="735" y="145" width="220" height="112" rx="12" fill="#125965"/><text x="753" y="192" font-size="30" fill="#ffffff" font-weight="700">Inspect</text><text x="753" y="232" font-size="25" fill="#ffffff" font-weight="400">6 s / part</text><path d="M267 204h115m-12-8 12 8-12 8" fill="none" stroke="#254149" stroke-width="4"/><rect x="308" y="191" width="26" height="26" rx="4" fill="#edf4f3" stroke="#254149" stroke-width="3"/><path d="M612 204h115m-12-8 12 8-12 8" fill="none" stroke="#254149" stroke-width="4"/><rect x="653" y="191" width="26" height="26" rx="4" fill="#edf4f3" stroke="#254149" stroke-width="3"/><text x="45" y="316" font-size="24" fill="#163036" font-weight="400">Assemble sets the baseline nominal ceiling: 3,600 ÷ 8 = 450 parts/h.</text></svg>
